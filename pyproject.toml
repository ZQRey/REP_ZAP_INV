[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = "(^alembic/|^tests/)"

[tool.bandit]
exclude_dirs = ["tests", "alembic"]
skips = ["B101"]
