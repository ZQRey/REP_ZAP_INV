name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static and security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_security.py
      - run: python scripts/audit_authorization.py
      - run: ruff check SHARED CARTRIDGE REPAIR LOCATION PORTAL main_server.py
      - run: bandit -c pyproject.toml -r SHARED CARTRIDGE REPAIR LOCATION main_server.py
      - run: pip-audit -r requirements.txt
      - name: Type check (advisory baseline)
        continue-on-error: true
        run: mypy SHARED CARTRIDGE/app REPAIR/app LOCATION/app main_server.py
      - name: JavaScript syntax
        run: |
          node --check PORTAL/static/api-client.js
          node --check PORTAL/static/portal.js
          node --check CARTRIDGE/app/static/js/app.js
          node --check REPAIR/app/static/js/repair_app.js
          node --check LOCATION/app/static/js/location_canvas.js

  tests:
    name: Unit API and security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest --junitxml=test-results.xml
      - run: python -m pytest tests/acceptance -v
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results.xml

  postgres:
    name: PostgreSQL migrations and isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/start_test_postgres.py
      - run: python -m pytest tests/migrations tests/security/test_branch_isolation.py -v
      - if: always()
        run: docker stop rep-zap-migration-test || true

  docker:
    name: Production Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate zero-config Compose interpolation and dependency graph
        run: env -i PATH="$PATH" HOME="$HOME" docker compose config --quiet
      - name: Build production Python services
        run: docker compose build database-migrations unified-server notification-worker
      - name: Verify production imports in built image
        run: docker compose run --rm --no-deps unified-server python -c "import main_server; import SHARED.notification_worker; print('production imports ok')"
