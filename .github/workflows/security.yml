name: Security regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest pyyaml
      - run: python scripts/check_security.py
      - run: python scripts/audit_authorization.py
      - run: python -m pytest
      - run: |
          node --check PORTAL/static/portal.js
          node --check CARTRIDGE/app/static/js/app.js
          node --check REPAIR/app/static/js/repair_app.js
          node --check LOCATION/app/static/js/location_canvas.js
  postgres-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest pyyaml
      - run: python scripts/start_test_postgres.py
      - run: python -m pytest tests/migrations tests/security/test_branch_isolation.py -v
      - if: always()
        run: docker stop rep-zap-migration-test || true
