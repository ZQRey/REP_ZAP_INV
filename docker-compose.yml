services:
  # Nginx Reverse Proxy (HTTP: 80, HTTPS: 443)
  nginx-proxy:
    image: nginx:alpine
    networks:
      default:
        ipv4_address: 172.30.88.10
    container_name: it_nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx_logs:/var/log/nginx
    depends_on:
      unified-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  secret-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    user: "0:0"
    command: ["sh", "/app/scripts/bootstrap_secrets.sh"]
    volumes:
      - app_secrets:/run/app-secrets

  # One-shot schema gate. Every normal Compose deployment applies reviewed Alembic
  # migrations before application processes are allowed to start.
  database-migrations:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://app_user:rep_zap_internal_db@postgres-db:5432/it_management}
    depends_on:
      secret-bootstrap:
        condition: service_completed_successfully
      postgres-db:
        condition: service_healthy

  # Единый веб-сервер и портал (Portal, Cartridge, Repair, Location API)
  unified-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: it_unified_portal
    restart: unless-stopped
    volumes:
      - ./BD:/app/BD
      - ./secrets/ssh:/run/ssh:ro
      - app_secrets:/run/app-secrets:ro
      - ./uploads:/app/LOCATION/app/static/uploads
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://app_user:rep_zap_internal_db@postgres-db:5432/it_management}
      - REDIS_URL=${REDIS_URL:-redis://:rep_zap_internal_redis@redis:6379/0}
      - EVOLUTION_API_URL=http://whatsapp-gateway:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-rep_zap_internal_evolution}
      - PYTHONUNBUFFERED=1
      - APP_ENV=${APP_ENV:-production}
      - NETWORK_ALLOWED_CIDRS=${NETWORK_ALLOWED_CIDRS:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - WHATSAPP_ENABLED=true
      - LDAP_ENABLED=${LDAP_ENABLED:-false}
      - LDAP_BIND_PASSWORD=${LDAP_BIND_PASSWORD:-}
      - SSH_KNOWN_HOSTS=/run/ssh/known_hosts
    depends_on:
      secret-bootstrap:
        condition: service_completed_successfully
      database-migrations:
        condition: service_completed_successfully
      redis:
        condition: service_started
      whatsapp-gateway:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Durable notification worker. PostgreSQL keeps the outbox; Redis only wakes workers.
  notification-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: it_notification_worker
    restart: unless-stopped
    command: ["python", "-m", "SHARED.notification_worker"]
    volumes:
      - ./secrets/ssh:/run/ssh:ro
      - app_secrets:/run/app-secrets:ro
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://app_user:rep_zap_internal_db@postgres-db:5432/it_management}
      - REDIS_URL=${REDIS_URL:-redis://:rep_zap_internal_redis@redis:6379/0}
      - APP_ENV=${APP_ENV:-production}
      - NOTIFICATION_POLL_SECONDS=${NOTIFICATION_POLL_SECONDS:-5}
      - NOTIFICATION_BATCH_SIZE=${NOTIFICATION_BATCH_SIZE:-25}
      - NOTIFICATION_PROCESSING_LEASE_SECONDS=${NOTIFICATION_PROCESSING_LEASE_SECONDS:-120}
    depends_on:
      database-migrations:
        condition: service_completed_successfully
      redis:
        condition: service_started
      whatsapp-gateway:
        condition: service_started

  # Единая СУБД: PostgreSQL 15 с расширением PostGIS для интерактивной карты
  postgres-db:
    image: postgis/postgis:15-3.3-alpine
    container_name: it_unified_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=it_management
      - POSTGRES_USER=app_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-rep_zap_internal_db}
    volumes:
      - ./BD/postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d it_management"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis для очередей задач (AD/SNMP воркеры) и WebSocket Pub/Sub карты
  redis:
    image: redis:7-alpine
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-rep_zap_internal_redis}
    container_name: it_unified_redis
    restart: unless-stopped
    volumes:
      - ./BD/redis_data:/data

  # Шлюз WhatsApp (Evolution API) — ТОЛЬКО ДЛЯ КАРТРИДЖЕЙ
  whatsapp-gateway:
    image: evoapicloud/evolution-api
    container_name: it_cartridge_whatsapp
    restart: unless-stopped
    volumes:
      - ./evolution_instances:/evolution/instances
    environment:
      - SERVER_PORT=8080
      - SERVER_TYPE=http
      - SERVER_URL=http://whatsapp-gateway:8080
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-rep_zap_internal_evolution}
      - AUTHENTICATION_TYPE=apikey
      - LOG_LEVEL=ERROR,WARN,INFO
      - DEL_INSTANCE=false
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=${EVOLUTION_DATABASE_URL:-postgresql://app_user:rep_zap_internal_db@postgres-db:5432/evolution}
      - DATABASE_CLIENT_NAME=evolution_cartridge
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=${EVOLUTION_REDIS_URL:-redis://:rep_zap_internal_redis@redis:6379/1}
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  app_secrets:


networks:
  default:
    ipam:
      config:
        - subnet: 172.30.88.0/24
