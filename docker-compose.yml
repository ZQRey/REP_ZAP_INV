services:
  # Nginx Reverse Proxy (HTTP: 80, HTTPS: 443)
  nginx-proxy:
    image: nginx:alpine
    container_name: it_nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx_logs:/var/log/nginx
    depends_on:
      - unified-server
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Единый веб-сервер и портал (Portal, Cartridge, Repair, Location API)
  unified-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: it_unified_portal
    restart: unless-stopped
    ports:
      - "8080:8000"  # Прямой порт приложения для отладки
    volumes:
      - ./BD:/app/BD
      - ./CARTRIDGE:/app/CARTRIDGE
      - ./REPAIR:/app/REPAIR
      - ./LOCATION:/app/LOCATION
      - ./PORTAL:/app/PORTAL
    environment:
      - DATABASE_URL=postgresql+psycopg2://app_user:app_password@postgres-db:5432/it_management
      - SECRET_KEY=unified-it-enterprise-secret-key-2026
      - REDIS_URL=redis://redis:6379/0
      - EVOLUTION_API_URL=http://whatsapp-gateway:8080
      - EVOLUTION_API_KEY=cartridge_secret_key_2026
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_started
      whatsapp-gateway:
        condition: service_started

  # Единая СУБД: PostgreSQL 15 с расширением PostGIS для интерактивной карты
  postgres-db:
    image: postgis/postgis:15-3.3-alpine
    container_name: it_unified_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=it_management
      - POSTGRES_USER=app_user
      - POSTGRES_PASSWORD=app_password
    volumes:
      - ./BD/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d it_management"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis для очередей задач (AD/SNMP воркеры) и WebSocket Pub/Sub карты
  redis:
    image: redis:7-alpine
    container_name: it_unified_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./BD/redis_data:/data

  # Шлюз WhatsApp (Evolution API) — ТОЛЬКО ДЛЯ КАРТРИДЖЕЙ
  whatsapp-gateway:
    image: evoapicloud/evolution-api
    container_name: it_cartridge_whatsapp
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./evolution_instances:/evolution/instances
    environment:
      - SERVER_PORT=8080
      - SERVER_TYPE=http
      - SERVER_URL=http://localhost:8081
      - AUTHENTICATION_API_KEY=cartridge_secret_key_2026
      - AUTHENTICATION_TYPE=apikey
      - LOG_LEVEL=ERROR,WARN,INFO
      - DEL_INSTANCE=false
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://app_user:app_password@postgres-db:5432/it_management?schema=evolution
      - DATABASE_CLIENT_NAME=evolution_cartridge
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
