worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Логирование
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Оптимизация передачи файлов
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Максимальный размер загружаемых файлов (поэтажные планы SVG/PNG, дампы)
    client_max_body_size 50M;

    # Gzip сжатие для быстродействия веб-интерфейсов (Tailwind, Konva, Alpine)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # WebSocket апгрейд
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream unified_backend {
        server unified-server:8000;
        keepalive 32;
    }

    # =======================================================
    # 1. HTTP СЕРВЕР (ПОРТ 80)
    # =======================================================
    server {
        listen 80;
        listen [::]:80;
        server_name localhost _;

        # Проксирование всех запросов на unified-server
        location / {
            proxy_pass http://unified_backend;
            proxy_http_version 1.1;

            # Заголовки обратного прокси
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;

            # Поддержка WebSocket (интерактивная карта, статусы)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Таймауты для тяжелых отчетов Excel и AD-синхронизации
            proxy_connect_timeout 120s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Эндпоинт проверки здоровья Nginx
        location /nginx-health {
            access_log off;
            return 200 "nginx is healthy\n";
        }
    }

    # =======================================================
    # 2. HTTPS СЕРВЕР (ПОРТ 443)
    # =======================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name localhost _;

        # SSL Сертификаты
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # Протоколы и шифры безопасности
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Проксирование всех запросов на unified-server
        location / {
            proxy_pass http://unified_backend;
            proxy_http_version 1.1;

            # Заголовки обратного прокси
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;

            # Поддержка WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Таймауты
            proxy_connect_timeout 120s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location /nginx-health {
            access_log off;
            return 200 "nginx ssl is healthy\n";
        }
    }
}
