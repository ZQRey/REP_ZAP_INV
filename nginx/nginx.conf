worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log crit;

    server_tokens off;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Preserve the scheme supplied by the external TLS reverse proxy.
    # If this service is accessed directly over HTTP, fall back to the local scheme.
    map $http_x_forwarded_proto $proxy_x_forwarded_proto {
        default $scheme;
        "~*^https$" https;
        "~*^http$" http;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Internal HTTP only. TLS and HSTS belong to the external reverse proxy.
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        location / {
            set $application_backend unified-server:8000;
            proxy_pass http://$application_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 120s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location /nginx-health {
            access_log off;
            return 200 "nginx is healthy\n";
        }
    }
}
